[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting-inventory-optimization"
version = "1.0.0"
description = "Independent supply chain analytics platform for demand forecasting, safety stock, ROP, EOQ, and ABC analysis using the public M5 schema."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prathipati Suneelkumar" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]
postgres = ["psycopg2-binary>=2.9"]
prophet = ["prophet>=1.1.5"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
